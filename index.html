<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Code Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="main-container">
        <div id="start-message" class="start-message">
            Press any key to get the JavaScript event properties
        </div>
        <div id="display-container" class="display-container" style="display: none;" role="status" aria-live="polite">
            <div class="key-container">
                <h4>event.key</h4>
                <div id="key-value" class="Key-Content">-</div>
            </div>
            <div class="key-container">
                <h4>event.code</h4>
                <div id="code-value" class="Key-Content">-</div>
            </div>
            <div class="key-container">
                <h4>event.keyCode</h4>
                <div id="keycode-value" class="Key-Content">-</div>
            </div>
        </div>
    </div>

    <script src="Script.js" ></script>
</body>
</html>
