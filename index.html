<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Code Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="instruction">Press any key to get the Key Info</h1>
        <div class="key-display" id="key-container" aria-live="polite" aria-atomic="true">
            <div class="key-card" tabindex="0" role="button" aria-labelledby="key-label">
                <h4 id="key-label">event.key</h4>
                <div class="Key-Content" id="key-v">-</div>
                <small class="copy-hint">Click to copy</small>
            </div>

            <div class="key-card" tabindex="0" role="button" aria-labelledby="code-label">
                <h4 id="code-label">event.code</h4>
                <div class="Key-Content" id="code-v">-</div>
                <small class="copy-hint">Click to copy</small>
            </div>

            <div class="key-card" tabindex="0" role="button" aria-labelledby="keycode-label">
                <h4 id="keycode-label">event.keyCode</h4>
                <div class="Key-Content" id="keycode-v">-</div>
                <small class="copy-hint">Click to copy</small>
            </div>
        </div>
    </div>

    <script src="Script.js"></script>
</body>
</html>
