<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Code Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <div id="initial-message">
            <h1 style="color: #afff;">Press any key to get the JavaScript event keycode</h1>
        </div>
        <div class="display-none" id="key-display" aria-live="polite">
            <div class="key-container">
                <h4>Key</h4>
                <div class="Key-Content" id="key-val">-</div>
            </div>
            <div class="key-container">
                <h4>Code</h4>
                <div class="Key-Content" id="code-val">-</div>
            </div>
            <div class="key-container">
                <h4>Key Code</h4>
                <div class="Key-Content" id="keycode-val">-</div>
            </div>
        </div>
    </div>

    <script src="Script.js" ></script>
</body>
</html>
