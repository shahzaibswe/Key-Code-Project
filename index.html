<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Key Code Explorer</title>
</head>
<body>
    <main id="insert" class="container" aria-live="polite">
        <div class="key-container">
            <h4 id="label-key">event.key</h4>
            <div class="Key-Content" aria-labelledby="label-key">-</div>
        </div>
        <div class="key-container">
            <h4 id="label-code">event.code</h4>
            <div class="Key-Content" aria-labelledby="label-code">-</div>
        </div>
        <div class="key-container">
            <h4 id="label-keycode">event.keyCode</h4>
            <div class="Key-Content" aria-labelledby="label-keycode">-</div>
        </div>
        <div id="instruction" style="color: #afff; margin-top: 10px; font-style: italic; font-size: 0.9rem;">
            Press any key to get the JavaScript event keycode
        </div>
    </main>
    <script src="Script.js"></script>
</body>
</html>
