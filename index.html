<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Code Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div id="welcome-message">
            <h1 class="animation" style="color: #afff;">Press any key to get the Key Info</h1>
        </div>
        <div id="display-container" style="display: none;" aria-live="polite">
            <div class="key-container" role="button" tabindex="0" title="Click to copy">
                <h4 class="animation">Key</h4>
                <div class="Key-Content" id="key-v">-</div>
            </div>
            <div class="key-container" role="button" tabindex="0" title="Click to copy">
                <h4 class="animation">Code</h4>
                <div class="Key-Content" id="code-v">-</div>
            </div>
            <div class="key-container" role="button" tabindex="0" title="Click to copy">
                <h4 class="animation">Key Code</h4>
                <div class="Key-Content" id="keycode-v">-</div>
            </div>
        </div>
    </main>
    <script src="Script.js"></script>
</body>
</html>
