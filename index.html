<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Code Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="insert" class="container">
        <div id="init" class="key-container">Press any key to get the event keycode</div>
        <div class="key-container" style="display:none">
            <h4>event.key</h4>
            <div id="key" aria-live="polite"></div>
        </div>
        <div class="key-container" style="display:none">
            <h4>event.code</h4>
            <div id="code" aria-live="polite"></div>
        </div>
        <div class="key-container" style="display:none">
            <h4>event.keyCode</h4>
            <div id="keyCode" aria-live="polite"></div>
        </div>
    </div>
    <script src="Script.js"></script>
</body>
</html>
