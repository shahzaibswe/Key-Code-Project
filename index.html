<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Code Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="insert" aria-live="polite">
        <div class="key-container" aria-labelledby="key-label">
            <h4 id="key-label">event.key</h4>
            <div class="Key-Content" id="key-value">Press any key</div>
        </div>
        <div class="key-container" aria-labelledby="code-label">
            <h4 id="code-label">event.code</h4>
            <div class="Key-Content" id="code-value">-</div>
        </div>
        <div class="key-container" aria-labelledby="keycode-label">
            <h4 id="keycode-label">event.keyCode</h4>
            <div class="Key-Content" id="keycode-value">-</div>
        </div>
    </div>

    <script src="Script.js" ></script>
</body>
</html>
