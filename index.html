<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Code Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="key-display-wrapper" aria-live="polite" aria-atomic="true">
      <div class="key-container" id="key-container">
        <div class="display-item">
          <h4>Key</h4>
          <div class="Key-Content" id="key-v">-</div>
        </div>
        <div class="display-item">
          <h4>Code</h4>
          <div class="Key-Content" id="code-v">-</div>
        </div>
        <div class="display-item">
          <h4>Key Code</h4>
          <div class="Key-Content" id="keycode-v">-</div>
        </div>
      </div>
    </div>
  </div>

  <script src="Script.js"></script>
</body>
</html>
