<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Code Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="onboarding" class="key-container">
            <div class="Key-Content">Press any key to get the JavaScript event keycode</div>
        </div>

        <div id="display-area" style="display: none;" aria-live="polite">
            <div class="key-container" id="card-key" role="button" tabindex="0" aria-label="Click to copy Key">
                <h4 id="label-key">Key</h4>
                <div id="key-value" class="Key-Content" aria-labelledby="label-key">-</div>
            </div>
            <div class="key-container" id="card-code" role="button" tabindex="0" aria-label="Click to copy Code">
                <h4 id="label-code">Code</h4>
                <div id="code-value" class="Key-Content" aria-labelledby="label-code">-</div>
            </div>
            <div class="key-container" id="card-keycode" role="button" tabindex="0" aria-label="Click to copy Key Code">
                <h4 id="label-keycode">Key Code</h4>
                <div id="keycode-value" class="Key-Content" aria-labelledby="label-keycode">-</div>
            </div>
        </div>
    </div>

    <script src="Script.js" ></script>
</body>
</html>
