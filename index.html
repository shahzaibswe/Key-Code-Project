<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Code Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="instruction" class="instruction">
    Press any key to get the JavaScript event keycode
  </div>
  <div class="container" id="container" style="display: none;">
    <div class="key-container" id="card-key" role="button" tabindex="0" aria-labelledby="label-key">
      <h4 id="label-key">Key</h4>
      <div class="Key-Content" id="display-key" aria-live="polite" aria-atomic="true">-</div>
      <div class="copy-hint">Click to copy</div>
    </div>

    <div class="key-container" id="card-code" role="button" tabindex="0" aria-labelledby="label-code">
      <h4 id="label-code">Code</h4>
      <div class="Key-Content" id="display-code" aria-live="polite" aria-atomic="true">-</div>
      <div class="copy-hint">Click to copy</div>
    </div>

    <div class="key-container" id="card-keycode" role="button" tabindex="0" aria-labelledby="label-keycode">
      <h4 id="label-keycode">Key Code</h4>
      <div class="Key-Content" id="display-keycode" aria-live="polite" aria-atomic="true">-</div>
      <div class="copy-hint">Click to copy</div>
    </div>
  </div>

  <script src="Script.js"></script>
</body>
</html>
