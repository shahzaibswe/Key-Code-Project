<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Key Code Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main role="main">
    <div id="instruction">Press any key to get the Key Info</div>

    <div id="container">
      <div class="key" tabindex="0" role="button" aria-label="Copy Key">
        <small>Key</small>
        <div class="key-value" id="key-v">-</div>
        <div class="copy-hint">Click to copy</div>
      </div>

      <div class="key" tabindex="0" role="button" aria-label="Copy Code">
        <small>Code</small>
        <div class="key-value" id="code-v">-</div>
        <div class="copy-hint">Click to copy</div>
      </div>

      <div class="key" tabindex="0" role="button" aria-label="Copy Key Code">
        <small>Key Code</small>
        <div class="key-value" id="keycode-v">-</div>
        <div class="copy-hint">Click to copy</div>
      </div>
    </div>
  </main>

  <script src="Script.js"></script>
</body>
</html>
